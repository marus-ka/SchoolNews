name: Школьные новости

on:
  schedule:
    # 04:47 UTC = 07:47 МСК
    - cron: "47 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: school-news
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Собрать и отправить сводку
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python school_news.py

      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "school-news-bot"
          git config user.email "school-news-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state: $(date -u +%F)" && git push)
